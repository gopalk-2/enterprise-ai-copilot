version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Enterprise AI Assistant — Production Docker Compose
# Services: redis · neo4j · backend (FastAPI)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Neo4j (GraphRAG) ──────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: enterprise-ai-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/enterprise_ai
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ..              # repo root (Dockerfile COPYs from backend/)
      dockerfile: docker/Dockerfile
    container_name: enterprise-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      # Override localhost URLs so they resolve to sibling containers
      - REDIS_URL=redis://redis:6379
      - NEO4J_URI=bolt://neo4j:7687
      - UVICORN_WORKERS=2
    volumes:
      # Persist Chroma vector store + SQLite fallback + logs across restarts
      - ../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
